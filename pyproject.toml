[tool.poetry]
name = "translation_engine"
version = "0.1.0"
description = "Bilingual Net: a Transformer that translates Moroccan Darija <-> English."
authors = ["Ben alla ismail <ismailbenalla@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.3.0"
matplotlib = "3.8.0"
ipython = "^8.24.0"
torchvision = "^0.18.0"
scikit-learn = "^1.4.2"
streamlit = "^1.34.0"
numpy = "<2.0.0"
transformers = "^4.44.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
nbformat = "^5.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
